<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Agency Sierra Leone - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="c:\Users\admin\Pictures\logo2.jpg" alt="Football Agency Sierra Leone Logo" class="logo-img">
        </div>
        <h1>Football Agency Sierra Leone</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="players.html">Players</a></li>
                <li><a href="matches.html">Matches</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page-content">
        <h2>Contact Us</h2>

        <div class="contact-container">
            <section class="contact-form-section">
                <form class="contact-form" action="#" method="POST">
                    
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Massage</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                    
                    <button type="submit" class="cta-button send-button">Sand</button>
                </form>
            </section>

            <section class="contact-info-section">
                <h3>Contact Info</h3>
                <p>1234 main street</p>
                <p>Freetown, Sierra Leone</p>
                <div class="info-detail">
                    <span class="icon">📞</span> +232-72581607
                </div>
                <div class="info-detail">
                    <span class="icon">📧</span> Info@footballagency.sl
                </div>
            </section>
        </div>

    </main>

    <footer>
        <div class="social-links">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        <p>@2025 Football Agency Sierra Leone</p>
    </footer>

</body>
</html>
